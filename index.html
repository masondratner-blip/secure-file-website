
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure File Share</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .description {
      text-align: center;
      color: #64748b;
    }

    .upload-area {
      margin-top: 25px;
      padding: 30px 15px;
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      text-align: center;
      background: #eff6ff;
    }

    input {
      display: block;
      width: 100%;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .file-list {
      margin-top: 30px;
    }

    .file-item {
      padding: 14px;
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .file-item a {
      color: #2563eb;
      font-weight: bold;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Secure File Share</h1>

    <p class="description">
      Upload and share files with everyone.
    </p>

    <section class="upload-area">

      <h2>Choose a file</h2>

      <p>PDF, PNG, JPG or TXT files only.</p>

      <input
        type="file"
        id="fileInput"
        accept=".pdf,.png,.jpg,.jpeg,.txt"
      >

      <button id="uploadButton" type="button">
        Upload File
      </button>

      <p id="status" role="status" aria-live="polite"></p>

    </section>

    <section class="file-list">

      <h2>Shared Files</h2>

      <div id="files">
        Loading files...
      </div>

    </section>

    <footer>
      Secure File Share | Public file sharing
    </footer>

  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const statusBox = document.getElementById("status");
    const filesBox = document.getElementById("files");

    const maxSize = 5 * 1024 * 1024;

    const allowedExtensions = [
      "pdf", "png", "jpg", "jpeg", "txt"
    ];

    async function loadFiles() {
      try {
        const response = await fetch("/api/files");

        if (!response.ok) {
          throw new Error("Could not load files.");
        }

        const files = await response.json();
        filesBox.replaceChildren();

        if (files.length === 0) {
          filesBox.textContent = "No files uploaded yet.";
          return;
        }

        files.forEach(file => {
          const item = document.createElement("div");
          item.className = "file-item";

          const link = document.createElement("a");
          link.href = "/api/files/" + encodeURIComponent(file.id);
          link.textContent = file.name;
          link.rel = "noopener";
          link.target = "_blank";

          item.appendChild(link);
          filesBox.appendChild(item);
        });

      } catch (error) {
        filesBox.textContent =
          "File storage will be connected in the next step.";
      }
    }

    uploadButton.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        statusBox.textContent = "Please choose a file first.";
        return;
      }

      const extension = file.name.split(".").pop().toLowerCase();

      if (!allowedExtensions.includes(extension)) {
        statusBox.textContent = "That file type is not allowed.";
        return;
      }

      if (file.size > maxSize) {
        statusBox.textContent = "Files must be 5 MB or smaller.";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      uploadButton.disabled = true;
      statusBox.textContent = "Uploading...";

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Upload failed.");
        }

        statusBox.textContent = "File uploaded successfully!";
        fileInput.value = "";
        await loadFiles();

      } catch (error) {
        statusBox.textContent =
          "Upload is not connected yet. We'll set up the server next.";
      } finally {
        uploadButton.disabled = false;
      }
    });

    loadFiles();
  </script>

</body>
</html>
